<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}BudgetMind{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      /* Palette */
      --bg: #0b1220;          /* page background */
      --card: #101a2f;        /* card background */
      --line: #1f2a44;        /* borders/dividers */
      --text: #f8fafc;        /* bright text */
      --muted: #cbd5e1;       /* readable secondary text */
      --chip: #16233d;        /* chip background */
      --brand: #4f46e5;
      --brand-dark: #4338ca;
      --success: #10b981;
      --success-dark: #0ea371;
  
      /* Bootstrap integration */
      --bs-body-color: var(--text);
      --bs-heading-color: var(--text);
      --bs-secondary-color: var(--muted);
    }
  
    html, body { background: var(--bg); color: var(--text); }
    .navbar { background: transparent; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; letter-spacing: .3px; color: var(--text); text-decoration: none; }
    .brand:hover { color: var(--text); opacity: .9; }
  
    /* Headings + secondary text */
    h1, h2, h3, h4, h5, h6 { color: var(--text); }
    .muted { color: var(--muted) !important; opacity: 1; }
  
    .card { background: var(--card); border: 1px solid var(--line); }
  
    /* Buttons */
    .btn-primary { background: var(--brand); border-color: var(--brand); }
    .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-download { background: var(--success); border: 0; color: #fff; }
    .btn-download:hover { background: var(--success-dark); color: #fff; }
  
    /* Inputs (including file input) */
    .form-control {
      background-color: var(--card);
      border-color: var(--line);
      color: var(--text);
    }
    .form-control:focus {
      box-shadow: 0 0 0 .25rem rgba(79,70,229,.25);
      border-color: var(--brand);
    }
    .form-text { color: var(--muted); }
  
    /* File input button (Chromium/Firefox) */
    input[type="file"].form-control::file-selector-button {
      background: var(--brand);
      color: #fff;
      border: 1px solid var(--brand);
      border-radius: .5rem;
      padding: .45rem .9rem;
      margin-right: .75rem;
      cursor: pointer;
    }
    input[type="file"].form-control:hover::file-selector-button {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }
    /* Safari */
    input[type="file"].form-control::-webkit-file-upload-button {
      background: var(--brand);
      color: #fff;
      border: 1px solid var(--brand);
      border-radius: .5rem;
      padding: .45rem .9rem;
      margin-right: .75rem;
      cursor: pointer;
    }
    input[type="file"].form-control:hover::-webkit-file-upload-button {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }
  
    /* Chip + category badges */
    .chip {
      background: var(--chip);
      border-radius: 9999px;
      padding: .5rem 1rem;
      display: inline-flex;
      gap: .5rem;
      align-items: center;
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
    }
    .badge-cat {
      border-radius: 9999px;
      padding: .25rem .6rem;
      color: #fff;
      font-weight: 600;
      font-size: .8rem;
    }
  
    /* Modern table theme */
    .table-wrap { border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .table-modern {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: transparent;
    }
    .table-modern thead th {
      position: sticky; top: 0; z-index: 1;
      background: #0e1730;                 /* darker header */
      color: #e2e8f0;                      /* brighter header text */
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: .78rem;
      border-bottom: 1px solid #1f2a44;
      padding: .85rem 1rem;
    }
    .table-modern tbody td {
      padding: .8rem 1rem;
      border-top: 1px solid rgba(255,255,255,.05);
    }
    .table-modern tbody tr:nth-child(even) { background: rgba(148,163,184,.05); } /* zebra */
    .table-modern tbody tr:hover { background: rgba(148,163,184,.1); }             /* hover */
    .table-modern .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  
    /* Ensure vertical scroll works with sticky header */
    .table-responsive { overflow-y: auto; }
  
    /* Make table header look stronger than default muted */
    .table thead th { color: #e2e8f0; }
  </style>
  
  {% block extra_head %}{% endblock %}
</head>
<body class="pb-5">

  <nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a class="brand" href="/">Budget Classifier AI</a>
      <div class="small muted">Smart spend insights</div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  {% block extra_scripts %}{% endblock %}
</body>
</html>

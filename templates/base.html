<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}BudgetMind{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      /* Palette */
      --bg: #0b1220;
      --card: #101a2f;
      --line: #1f2a44;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --chip: #16233d;
      --brand: #4f46e5;
      --success: #10b981;

      /* Bootstrap variable overrides */
      --bs-primary: var(--brand);
      --bs-primary-rgb: 79,70,229;
      --bs-success: var(--success);
      --bs-success-rgb: 16,185,129;

      --bs-body-bg: var(--bg);
      --bs-body-color: var(--text);
      --bs-border-color: var(--line);
      --bs-heading-color: var(--text);
      --bs-secondary-color: var(--muted);

      --bs-card-bg: var(--card);
      --bs-card-border-color: var(--line);

      --bs-form-control-bg: var(--card);
      --bs-form-control-color: var(--text);
      --bs-form-control-border-color: var(--line);
      --bs-focus-ring-color: rgba(79,70,229,.25);
    }

    html, body { background: var(--bg); color: var(--text); }
    .navbar { background: transparent; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; letter-spacing: .3px; color: var(--text); text-decoration: none; }
    .brand:hover { color: var(--text); opacity: .9; }
    .muted { color: var(--muted) !important; }

    .card { background: var(--card); border: 1px solid var(--line); }

    /* Optional helper button using your success color */
    .btn-download { background: var(--success); border: 0; color: #fff; }
    .btn-download:hover { filter: brightness(0.9); color: #fff; }

    /* File input button: black, subtle hover color + shadow */
input[type="file"].form-control::file-selector-button {
  background-color: #000 !important;
  color: #fff !important;
  border: 1px solid #000 !important;
  border-radius: .375rem !important;
  padding: .45rem .9rem !important;
  margin-right: .75rem !important;
  cursor: pointer !important;
  transition: background-color 0.15s ease, box-shadow 0.15s ease !important;
}
input[type="file"].form-control:hover::file-selector-button {
  background-color: #1a1a1a !important; /* lighter black */
  border-color: #1a1a1a !important;
  box-shadow: 0 0 6px rgba(255,255,255,0.15) !important;
}

/* Safari/WebKit */
input[type="file"].form-control::-webkit-file-upload-button {
  background-color: #000 !important;
  color: #fff !important;
  border: 1px solid #000 !important;
  border-radius: .375rem !important;
  padding: .45rem .9rem !important;
  margin-right: .75rem !important;
  cursor: pointer !important;
  transition: background-color 0.15s ease, box-shadow 0.15s ease !important;
}
input[type="file"].form-control:hover::-webkit-file-upload-button {
  background-color: #1a1a1a !important;
  border-color: #1a1a1a !important;
  box-shadow: 0 0 6px rgba(255,255,255,0.15) !important;
}


    /* Chips & badges */
    .chip {
      background: var(--chip);
      border-radius: 9999px;
      padding: .5rem 1rem;
      display: inline-flex;
      gap: .5rem;
      align-items: center;
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
    }
    .badge-cat {
      border-radius: 9999px;
      padding: .25rem .6rem;
      color: #fff;
      font-weight: 600;
      font-size: .8rem;
    }

    /* Dark table theme */
    .table-wrap { border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .table-modern { width: 100%; border-collapse: separate; border-spacing: 0; background: transparent; }
    .table-modern thead th {
      position: sticky; top: 0; z-index: 1;
      background: #0e1730;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: .78rem;
      border-bottom: 1px solid #1f2a44;
      padding: .85rem 1rem;
    }
    .table-modern tbody td { padding: .8rem 1rem; border-top: 1px solid rgba(255,255,255,.05); }
    .table-modern tbody tr:nth-child(even) { background: rgba(148,163,184,.05); }
    .table-modern tbody tr:hover { background: rgba(148,163,184,.1); }
    .table thead th { color: #e2e8f0; }
    .table-responsive { overflow-y: auto; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="pb-5">
  <nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a class="brand" href="/">Budget Classifier AI</a>
      <div class="small muted">Smart spend insights</div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
    <!-- Example usage:
    <input class="form-control" type="file" name="statement" accept="application/pdf" required>
    -->
  </main>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
